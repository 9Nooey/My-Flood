name: Update Water Data

on:
  schedule:
    # รันอัตโนมัติทุกๆ 15 นาที
    - cron: '*/15 * * * *'
  workflow_dispatch: # กดปุ่มสั่งรันมือได้ตลอดเวลา

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Water Data
        env:
          THAIWATER_API_KEY: ${{ secrets.THAIWATER_API_KEY }}
        run: node scripts/fetch-data.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/water.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update water data [skip ci]" && git push)
